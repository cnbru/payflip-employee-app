<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payflip — HR Admin</title>
  <script>
    // Ensure relative asset paths (css, jsx, images) always resolve inside this
    // directory — the app does client-side history.pushState navigation
    // (e.g. "/hr-admin/people"), so location.pathname is often deeper than the
    // hr-admin root, and it never has a trailing slash. Anchor on the known
    // "hr-admin" mount segment rather than the last "/", which would otherwise
    // treat a route like "/hr-admin/people" as the directory "/hr-admin/people/".
    (function () {
      var path = location.pathname;
      var idx = path.indexOf('/hr-admin');
      path = idx !== -1 ? path.slice(0, idx) + '/hr-admin/' : '/hr-admin/';
      var base = document.createElement('base');
      base.href = path;
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" href="colors_and_type.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--gray-100);
      font-family: var(--font-body);
      color: var(--text-default);
    }
    #root { height: 100%; }
    button:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; border-radius: 6px; }
    button.btn-press:not([disabled]) { transition: transform 150ms cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    button.btn-press:not([disabled]):active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      button.btn-press:not([disabled]) { transition: none; }
      button.btn-press:not([disabled]):active { transform: none; }
    }
    .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    input::placeholder { color: var(--gray-400); opacity: 1; }

    /* Number pop-in — transitions.dev/02 */
    :root {
      --digit-dur: 280ms;
      --digit-distance: 8px;
      --digit-stagger: 60ms;
      --digit-blur: 2px;
      --digit-ease: cubic-bezier(0.34, 1.45, 0.64, 1);
      --digit-dir-x: 0;
      --digit-dir-y: 1;
    }
    @keyframes t-digit-pop-in {
      0%   { transform: translate(calc(var(--digit-distance) * var(--digit-dir-x)), calc(var(--digit-distance) * var(--digit-dir-y))); opacity: 0; filter: blur(var(--digit-blur)); }
      100% { transform: translate(0, 0); opacity: 1; filter: blur(0); }
    }
    .t-digit-group { display: inline-flex; align-items: baseline; }
    .t-digit { display: inline-block; will-change: transform, opacity, filter; }
    .t-digit-group.is-animating .t-digit {
      animation: t-digit-pop-in var(--digit-dur) var(--digit-ease) var(--row-delay, 0ms) both;
    }
    .t-digit-group.is-animating .t-digit[data-stagger="1"] { animation-delay: calc(var(--digit-stagger) + var(--row-delay, 0ms)); }
    .t-digit-group.is-animating .t-digit[data-stagger="2"] { animation-delay: calc(var(--digit-stagger) * 2 + var(--row-delay, 0ms)); }
    @media (prefers-reduced-motion: reduce) {
      .t-digit-group .t-digit { animation: none !important; }
    }

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin-cw { animation: none !important; }
    }

    @keyframes gradientDrift {
      from { opacity: 0; }
      to   { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gradient-drift { animation: none !important; }
    }

    @keyframes linkCardTop {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes linkCardBottom {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes linkBadgePop {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .link-card-top, .link-card-bottom { animation: none !important; }
      .link-badge-pop { animation: linkBadgeFade 150ms ease both !important; }
    }
    @keyframes linkBadgeFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .amount-display-input::-webkit-inner-spin-button,
    .amount-display-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .amount-display-input { -moz-appearance: textfield; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-reveal {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1), transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @starting-style {
      .section-reveal { opacity: 0; transform: translateY(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .section-reveal { transition: opacity 150ms ease; }
      @starting-style { .section-reveal { opacity: 0; transform: none; } }
    }

    @keyframes relaunchFloatIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }
    @keyframes relaunchFloatOut {
      to { opacity: 0; transform: translateY(8px) scale(0.96); }
    }
    @keyframes relaunchFloatOutReduced { to { opacity: 0; } }
    @keyframes relaunchCountIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes relaunchCountFade { from { opacity: 0; } to { opacity: 1; } }
    .relaunch-float.is-leaving {
      animation: relaunchFloatOut 180ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
      pointer-events: none;
    }
    .relaunch-count {
      display: inline-block;
      animation: relaunchCountIn 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .relaunch-float-close {
      background: transparent;
      transition: background 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .relaunch-float-close:hover { background: rgba(255,255,255,0.08); }
    .relaunch-float-launcher { background: #1c1c1e; transition: background 150ms cubic-bezier(0.22, 1, 0.36, 1); }
    .relaunch-float-launcher:hover { background: #2a2a2e; }
    .relaunch-check::before { content: ""; position: absolute; inset: -12px 0; }
    .relaunch-check-input {
      position: absolute; width: 18px; height: 18px; margin: 0; opacity: 0; cursor: inherit;
    }
    .relaunch-check-input:focus-visible + .relaunch-check-box {
      outline: 2px solid var(--blue-500); outline-offset: 2px;
    }
    .relaunch-float-close:focus-visible,
    .relaunch-float-launcher:focus-visible,
    .relaunch-float-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .relaunch-float-body { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; }
    .relaunch-float-body::-webkit-scrollbar { width: 8px; }
    .relaunch-float-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 4px; }
    .relaunch-float-link {
      position: relative;
      display: inline-flex; align-items: center;
      padding: 0 2px; border: none; background: none; cursor: pointer;
      font-family: var(--font-body); font-size: var(--fs-body-xs); font-weight: 500;
      color: rgba(255,255,255,0.92);
      text-decoration: underline; text-decoration-color: rgba(255,255,255,0.55); text-underline-offset: 3px;
      transition: color 150ms cubic-bezier(0.22, 1, 0.36, 1), text-decoration-color 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .relaunch-float-link::before { content: ""; position: absolute; inset: -12px 0; }
    .relaunch-float-link:hover { color: #fff; text-decoration-color: #fff; }
    .relaunch-done-title {
      position: relative;
      color: oklch(0.827 0 286);
      transition: color 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @starting-style {
      .relaunch-done-title { color: #fff; }
    }
    .relaunch-done-strike {
      position: absolute;
      left: 0; right: 0; top: 55%;
      height: 1px;
      background: currentColor;
      transform: scaleX(1);
      transform-origin: left center;
      pointer-events: none;
      transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @starting-style {
      .relaunch-done-strike { transform: scaleX(0); }
    }
    .relaunch-open-mark {
      display: flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid #3a3a3e;
      color: #5c5c60;
    }
    .relaunch-done-mark {
      display: flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      color: oklch(0.827 0 286);
      opacity: 1;
      transform: none;
      transition: color 200ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms cubic-bezier(0.22, 1, 0.36, 1) 80ms, transform 200ms cubic-bezier(0.22, 1, 0.36, 1) 80ms;
    }
    @starting-style {
      .relaunch-done-mark { color: #fff; opacity: 0; transform: translateY(4px); }
    }
    .relaunch-entity-search-wrap {
      border: 1px solid var(--gray-200);
      transition: border-color 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .relaunch-entity-search-wrap:hover { border-color: var(--gray-400); }
    .relaunch-entity-search-wrap:focus-within {
      outline: 2px solid var(--gray-700);
      outline-offset: 2px;
    }
    .relaunch-entity-search {
      border: none;
      outline: none;
      background: transparent;
    }
    .relaunch-entity-row {
      background: transparent;
      transition: background 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (hover: hover) {
      .relaunch-entity-row:hover { background: var(--gray-100); }
    }
    .relaunch-entity-row:active { background: var(--gray-200); }
    .relaunch-entity-row:focus-visible {
      outline: 2px solid var(--gray-700);
      outline-offset: -2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .relaunch-float:not(.is-leaving), .relaunch-float-launcher { animation: none !important; }
      .relaunch-float.is-leaving { animation: relaunchFloatOutReduced 160ms ease forwards !important; }
      .relaunch-count { animation: relaunchCountFade 160ms ease; }
      .relaunch-check-box { transition: none !important; }
      .relaunch-float-link, .relaunch-float-close, .relaunch-float-launcher,
      .relaunch-entity-search-wrap, .relaunch-entity-row,
      .relaunch-done-title, .relaunch-done-strike, .relaunch-done-mark { transition: none; }
      @starting-style {
        .relaunch-done-title { color: oklch(0.827 0 286); }
        .relaunch-done-strike { transform: none; }
        .relaunch-done-mark { color: oklch(0.827 0 286); opacity: 1; transform: none; }
      }
    }

    .filter-count-badge {
      transform: scale(1);
      opacity: 1;
      transition: transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 100ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @starting-style {
      .filter-count-badge { transform: scale(0.5); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .filter-count-badge { transition: opacity 100ms cubic-bezier(0.22, 1, 0.36, 1); }
      @starting-style { .filter-count-badge { transform: none; opacity: 0; } }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
