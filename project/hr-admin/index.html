<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payflip — HR Admin</title>
  <script>
    // Ensure relative asset paths (css, jsx, images) always resolve inside this
    // directory — the app does client-side history.pushState navigation
    // (e.g. "/hr-admin/people"), so location.pathname is often deeper than the
    // hr-admin root, and it never has a trailing slash. Anchor on the known
    // "hr-admin" mount segment rather than the last "/", which would otherwise
    // treat a route like "/hr-admin/people" as the directory "/hr-admin/people/".
    (function () {
      var path = location.pathname;
      var idx = path.indexOf('/hr-admin');
      path = idx !== -1 ? path.slice(0, idx) + '/hr-admin/' : '/hr-admin/';
      var base = document.createElement('base');
      base.href = path;
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" href="colors_and_type.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--gray-100);
      font-family: var(--font-body);
      color: var(--text-default);
    }
    #root { height: 100%; }
    button:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; border-radius: 6px; }
    button:not([disabled]) { transition: transform 150ms cubic-bezier(0.22, 1, 0.36, 1); }
    button:not([disabled]):active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      button:not([disabled]) { transition: none; }
      button:not([disabled]):active { transform: none; }
    }
    .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    input::placeholder { color: #0f0d28; opacity: 1; }

    /* Number pop-in — transitions.dev/02 */
    :root {
      --digit-dur: 400ms;
      --digit-distance: 8px;
      --digit-stagger: 60ms;
      --digit-blur: 2px;
      --digit-ease: cubic-bezier(0.34, 1.45, 0.64, 1);
      --digit-dir-x: 0;
      --digit-dir-y: 1;
    }
    @keyframes t-digit-pop-in {
      0%   { transform: translate(calc(var(--digit-distance) * var(--digit-dir-x)), calc(var(--digit-distance) * var(--digit-dir-y))); opacity: 0; filter: blur(var(--digit-blur)); }
      100% { transform: translate(0, 0); opacity: 1; filter: blur(0); }
    }
    .t-digit-group { display: inline-flex; align-items: baseline; }
    .t-digit { display: inline-block; will-change: transform, opacity, filter; }
    .t-digit-group.is-animating .t-digit {
      animation: t-digit-pop-in var(--digit-dur) var(--digit-ease) both;
    }
    .t-digit-group.is-animating .t-digit[data-stagger="1"] { animation-delay: var(--digit-stagger); }
    .t-digit-group.is-animating .t-digit[data-stagger="2"] { animation-delay: calc(var(--digit-stagger) * 2); }
    @media (prefers-reduced-motion: reduce) {
      .t-digit-group .t-digit { animation: none !important; }
    }

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin-cw { animation: none !important; }
    }

    @keyframes gradientDrift {
      from { opacity: 0; }
      to   { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gradient-drift { animation: none !important; }
    }

    @keyframes linkCardTop {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes linkCardBottom {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes linkBadgePop {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .link-card-top, .link-card-bottom { animation: none !important; }
      .link-badge-pop { animation: linkBadgeFade 150ms ease both !important; }
    }
    @keyframes linkBadgeFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>

  <style id="t-stack-css">
    :root {
      --stack-open: 350ms;
      --stack-close: 250ms;
      --stack-rise: 80px;
      --stack-blur: 2px;
      --stack-scale: 0.97;
      --stack-peek: 12px;
      --stack-spread-gap: 8px;
      --stack-depth-scale: 0.06;
      --stack-depth-fade: 0.4;
      --stack-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .t-stack { position: relative; }
    .t-stack-banner {
      position: absolute;
      left: 0;
      bottom: 0;
      transform-origin: 50% 50%;
      filter: blur(0);
      will-change: transform, opacity, filter;
      transition:
        transform var(--stack-open) var(--stack-ease),
        opacity var(--stack-open) var(--stack-ease),
        filter var(--stack-open) var(--stack-ease);
    }
    /* depth-0 is position:relative so the container has natural dimensions */
    .t-stack-banner[data-depth="0"] {
      position: relative;
      z-index: 3;
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .t-stack-banner[data-depth="1"] {
      z-index: 2;
      transform-origin: 50% 100%;
      transform: translateY(calc(var(--stack-peek) * -1)) scale(calc(1 - var(--stack-depth-scale)));
      opacity: calc(1 - var(--stack-depth-fade));
    }
    .t-stack-banner[data-depth="2"] {
      z-index: 1;
      transform-origin: 50% 100%;
      transform: translateY(calc(var(--stack-peek) * -2)) scale(calc(1 - var(--stack-depth-scale) * 2));
      opacity: calc(1 - var(--stack-depth-fade) * 1.6);
    }
    .t-stack.is-spread .t-stack-banner[data-depth="1"],
    .t-stack.is-spread .t-stack-banner[data-depth="2"] { opacity: 1; }
    .t-stack.is-spread .t-stack-banner[data-depth="1"] {
      transform: translateY(calc((100% + var(--stack-spread-gap)) * -1)) scale(1);
    }
    .t-stack.is-spread .t-stack-banner[data-depth="2"] {
      transform: translateY(calc((100% + var(--stack-spread-gap)) * -2)) scale(1);
    }
    .t-stack-banner.is-enter {
      transition: none;
      transform: translateY(var(--stack-rise)) scale(var(--stack-scale));
      opacity: 0;
      filter: blur(var(--stack-blur));
    }
    .t-stack-banner.is-leaving {
      z-index: 0;
      transform-origin: 50% 100%;
      transform: translateY(calc(var(--stack-peek) * -3)) scale(calc(1 - var(--stack-depth-scale) * 3));
      opacity: 0;
      filter: blur(var(--stack-blur));
      transition:
        transform var(--stack-close) var(--stack-ease),
        opacity var(--stack-close) var(--stack-ease),
        filter var(--stack-close) var(--stack-ease);
    }
    @media (prefers-reduced-motion: reduce) {
      .t-stack-banner { transition: none !important; transform: none !important; filter: none !important; }
    }
  </style>
