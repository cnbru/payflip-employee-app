<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proto — CardTab</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--gray-100);
      font-family: var(--font-body);
      color: var(--gray-900);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Simulated tab-panel context ── */
    .page-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .page-header {
      background: var(--gray-0);
      border-bottom: 1px solid var(--gray-200);
      padding: 20px 32px 0;
      flex-shrink: 0;
    }
    .page-header-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      color: var(--gray-900);
      margin: 0 0 16px;
    }
    .page-tabs {
      display: flex;
      gap: 0;
    }
    .page-tab {
      padding: 8px 16px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--gray-700);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .page-tab.active {
      color: var(--gray-900);
      border-bottom-color: var(--gray-900);
      font-weight: 600;
    }
    .page-content {
      flex: 1;
      padding: var(--space-500) var(--space-400) var(--space-400);
    }

    /* ── Stage ── */
    #stage { width: 100%; }

    /* ── Shared component styles ── */
    .card-img {
      display: block;
      border-radius: 14px;
    }

    /* ── Picker (verbatim from spec) ── */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }
    .proto-picker[data-ready] .proto-picker-highlight {
      transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }

    /* ── Variant-specific styles ── */

    /* V1: Hero */
    .v1-wrap { max-width: 540px; }
    .v1-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .v1-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--gray-900); }
    .v1-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--success-100); color: var(--success-500);
      border-radius: 20px; padding: 2px 9px;
      font-family: var(--font-display); font-weight: 600; font-size: 12px;
    }
    .v1-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .v1-meta { font-size: 13px; color: var(--gray-700); margin-bottom: 28px; }
    .v1-card-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }
    .v1-card-glow {
      position: absolute;
      inset: -20px;
      border-radius: 30px;
      background: radial-gradient(ellipse at 50% 60%, rgba(107, 45, 232, 0.22) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(8px);
    }
    .v1-card-img {
      width: 280px;
      height: 176px;
      display: block;
      border-radius: 14px;
      box-shadow:
        0 2px 4px rgba(15,13,40,0.08),
        0 8px 24px rgba(15,13,40,0.18),
        0 20px 48px rgba(107,45,232,0.16);
      transform: perspective(900px) rotateY(-7deg) rotateX(2deg);
      transform-style: preserve-3d;
      position: relative;
    }
    .v1-actions { display: flex; flex-direction: column; gap: 1px; background: var(--gray-200); border-radius: 12px; overflow: hidden; border: 1px solid var(--gray-200); }
    .v1-action-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--gray-0);
      cursor: pointer;
      border: none;
      width: 100%;
      text-align: left;
      transition: background 120ms ease-out, transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .v1-action-row:hover { background: var(--gray-50, #f9f9fb); }
    .v1-action-row:active { transform: scale(0.99); }
    .v1-action-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--gray-100); border: 1px solid var(--gray-200);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .v1-action-label { font-family: var(--font-body); font-size: 14px; color: var(--gray-900); flex: 1; }
    .v1-action-sub { font-size: 12px; color: var(--gray-700); margin-top: 1px; }
    .v1-chevron { color: var(--gray-400); }

    /* V2: Status-first */
    .v2-wrap { max-width: 600px; }
    .v2-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
      background: var(--gray-0); border: 1px solid var(--gray-200); border-radius: 14px;
      padding: 24px; margin-bottom: 16px;
    }
    .v2-info { flex: 1; min-width: 0; }
    .v2-card-num {
      font-family: var(--font-display); font-weight: 800;
      font-size: 28px; letter-spacing: -0.03em; color: var(--gray-900);
      font-variant-numeric: tabular-nums; line-height: 1;
      margin-bottom: 10px;
    }
    .v2-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--success-100); color: var(--success-500);
      border-radius: 20px; padding: 2px 9px;
      font-family: var(--font-display); font-weight: 600; font-size: 12px;
      margin-bottom: 14px;
    }
    .v2-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .v2-stats { display: flex; flex-direction: column; gap: 4px; }
    .v2-stat { font-size: 13px; color: var(--gray-700); }
    .v2-stat strong { color: var(--gray-900); font-weight: 500; }
    .v2-card-thumb { flex-shrink: 0; }
    .v2-card-img {
      width: 168px; height: 106px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(15,13,40,0.18);
      display: block;
    }
    .v2-action-strip {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .v2-action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 8px;
      background: var(--gray-0); border: 1px solid var(--gray-200); border-radius: 12px;
      cursor: pointer; font-family: var(--font-body); font-size: 12px; color: var(--gray-700);
      transition: background 120ms ease-out, transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center;
    }
    .v2-action-btn:hover { background: var(--gray-100); }
    .v2-action-btn:active { transform: scale(0.97); }
    .v2-action-icon-wrap {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--gray-100); border: 1px solid var(--gray-200);
      display: flex; align-items: center; justify-content: center;
    }

    /* V3: Wallet */
    .v3-wrap { max-width: 420px; }
    .v3-card-section {
      position: relative;
      margin-bottom: 28px;
    }
    .v3-card-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .v3-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--gray-900); }
    .v3-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--success-100); color: var(--success-500);
      border-radius: 20px; padding: 2px 9px;
      font-family: var(--font-display); font-weight: 600; font-size: 12px;
    }
    .v3-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .v3-card-img {
      width: 100%;
      height: auto;
      aspect-ratio: 1.586;
      border-radius: 18px;
      box-shadow:
        0 2px 4px rgba(15,13,40,0.06),
        0 8px 20px rgba(15,13,40,0.16),
        0 24px 48px rgba(107,45,232,0.14);
      display: block;
    }
    .v3-meta {
      text-align: center; font-size: 13px; color: var(--gray-700);
      margin-top: 12px;
    }
    .v3-actions {
      display: flex; justify-content: center; gap: 20px;
      margin-top: 24px;
    }
    .v3-action {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; background: none; border: none; padding: 4px 8px;
      transition: transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .v3-action:active { transform: scale(0.94); }
    .v3-action-circle {
      width: 52px; height: 52px; border-radius: 50%;
      border: 1px solid var(--gray-200); background: var(--gray-0);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 3px rgba(15,13,40,0.08), 0 4px 12px rgba(15,13,40,0.06);
      transition: background 120ms ease-out, box-shadow 120ms ease-out;
    }
    .v3-action:hover .v3-action-circle {
      background: var(--gray-100);
      box-shadow: 0 1px 2px rgba(15,13,40,0.06), 0 2px 8px rgba(15,13,40,0.04);
    }
    .v3-action-label {
      font-family: var(--font-body); font-size: 12px; color: var(--gray-700);
      text-align: center; white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="page-shell">
  <div class="page-header">
    <div class="page-header-name">Bram Goossens</div>
    <div class="page-tabs">
      <div class="page-tab">Choices</div>
      <div class="page-tab">Budgets</div>
      <div class="page-tab active">Card</div>
      <div class="page-tab">Compensation</div>
      <div class="page-tab">Details &amp; roles</div>
      <div class="page-tab">Leave &amp; absences</div>
    </div>
  </div>
  <div class="page-content">
    <div id="stage"></div>
  </div>
</div>

<!-- Picker -->
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Hero</button>
  <button class="proto-picker-item">Status-first</button>
  <button class="proto-picker-item">Wallet</button>
</nav>

<!-- Inline SVG icons -->
<svg style="display:none">
  <symbol id="ico-snowflake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="2" x2="12" y2="22"/><path d="M17 7l-5 5-5-5"/><path d="M17 17l-5-5-5 5"/>
    <line x1="2" y1="12" x2="22" y2="12"/><path d="M7 7l5 5 5-5"/><path d="M7 17l5-5 5 5"/>
  </symbol>
  <symbol id="ico-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
    <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
  </symbol>
  <symbol id="ico-refresh-cw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
  </symbol>
  <symbol id="ico-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
  </symbol>
  <symbol id="ico-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9 18 15 12 9 6"/>
  </symbol>
</svg>

<script>
  const CARD_IMG = '../assets/card.svg';
  const GRAY_700 = 'var(--gray-700)';

  function icon(id, size, color) {
    return `<svg width="${size}" height="${size}" style="display:inline-flex;flex-shrink:0;color:${color||GRAY_700}"><use href="#ico-${id}"/></svg>`;
  }

  const actions = [
    { id: 'snowflake',      label: 'Freeze card',   sub: 'Temporarily disable spending' },
    { id: 'alert-triangle', label: 'Report lost',   sub: 'Mark card as lost or stolen' },
    { id: 'refresh-cw',     label: 'Replace card',  sub: 'Issue a new card number' },
    { id: 'ban',            label: 'Block card',    sub: 'Permanently deactivate' },
  ];

  // ── Variant 1: Hero ────────────────────────────────────────────────────────
  function renderHero() {
    const rows = actions.map(a => `
      <button class="v1-action-row" onclick="void 0">
        <span class="v1-action-icon">${icon(a.id, 16, GRAY_700)}</span>
        <span>
          <span class="v1-action-label">${a.label}</span>
          <span class="v1-action-sub">${a.sub}</span>
        </span>
        <span class="v1-chevron">${icon('chevron-right', 14, 'var(--gray-400)')}</span>
      </button>
    `).join('');

    return `
      <div class="v1-wrap">
        <div class="v1-title-row">
          <span class="v1-name">Virtual card ···· 8231</span>
          <span class="v1-badge"><span class="v1-badge-dot"></span>Active</span>
        </div>
        <div class="v1-meta">Last used 2 days ago</div>
        <div class="v1-card-wrap">
          <div class="v1-card-glow"></div>
          <img class="v1-card-img" src="${CARD_IMG}" alt="Payflip Card" />
        </div>
        <div class="v1-actions">${rows}</div>
      </div>
    `;
  }

  // ── Variant 2: Status-first ────────────────────────────────────────────────
  function renderStatusFirst() {
    const btns = actions.map(a => `
      <button class="v2-action-btn">
        <span class="v2-action-icon-wrap">${icon(a.id, 16, GRAY_700)}</span>
        <span>${a.label}</span>
      </button>
    `).join('');

    return `
      <div class="v2-wrap">
        <div class="v2-header">
          <div class="v2-info">
            <div class="v2-card-num">···· 8231</div>
            <div class="v2-badge"><span class="v2-badge-dot"></span>Active</div>
            <div class="v2-stats">
              <div class="v2-stat">Type <strong>Virtual card</strong></div>
              <div class="v2-stat">Last used <strong>2 days ago</strong></div>
            </div>
          </div>
          <div class="v2-card-thumb">
            <img class="v2-card-img" src="${CARD_IMG}" alt="Payflip Card" />
          </div>
        </div>
        <div class="v2-action-strip">${btns}</div>
      </div>
    `;
  }

  // ── Variant 3: Wallet ──────────────────────────────────────────────────────
  function renderWallet() {
    const circles = actions.map(a => `
      <button class="v3-action">
        <span class="v3-action-circle">${icon(a.id, 18, GRAY_700)}</span>
        <span class="v3-action-label">${a.label}</span>
      </button>
    `).join('');

    return `
      <div class="v3-wrap">
        <div class="v3-card-top">
          <span class="v3-name">Virtual card ···· 8231</span>
          <span class="v3-badge"><span class="v3-badge-dot"></span>Active</span>
        </div>
        <img class="v3-card-img" src="${CARD_IMG}" alt="Payflip Card" />
        <div class="v3-meta">Last used 2 days ago</div>
        <div class="v3-actions">${circles}</div>
      </div>
    `;
  }

  // ── Picker wiring (verbatim from spec) ─────────────────────────────────────
  const variants = [renderHero, renderStatusFirst, renderWallet];
  const stage = document.getElementById('stage');
  const picker = document.querySelector('.proto-picker');
  const highlight = picker.querySelector('.proto-picker-highlight');
  const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
  let current = 0;

  function moveHighlight() {
    const el = items[current];
    highlight.style.width = el.offsetWidth + 'px';
    highlight.style.transform = `translateX(${el.offsetLeft}px)`;
  }

  function mount(i) {
    stage.innerHTML = '';
    requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
  }

  function setActive(i) {
    if (i < 0 || i >= variants.length) return;
    current = i;
    items.forEach((el, j) => {
      el.toggleAttribute('data-active', j === i);
      if (j === i) el.setAttribute('aria-current', 'true');
      else el.removeAttribute('aria-current');
    });
    moveHighlight();
    const url = new URL(location);
    url.searchParams.set('v', i + 1);
    history.replaceState(null, '', url);
    mount(i);
  }

  items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
  window.addEventListener('resize', moveHighlight);

  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= variants.length) setActive(num - 1);
    else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
    else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
    else if (e.key === 'r' || e.key === 'R') mount(current);
  });

  setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
