<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Payflip — Onboarding</title>
<meta name="ext-resource-dependency" content="assets/payflip-logo.svg" data-resource-id="payflipLogo" />
<meta name="ext-resource-dependency" content="assets/itsme.png" data-resource-id="itsmePng" />

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  @font-face {
    font-family: "Studio Feixen Sans";
    src: url("assets/StudioFeixenSans-Semibold.otf") format("opentype");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; font-family: "Poppins", sans-serif;
    background: radial-gradient(ellipse at center, #f5f3f0 0%, #e8e5e0 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  button { font-family: inherit; }
  input::placeholder { color: #b8b9c4; }

  .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .hide-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  @keyframes slideOutLeft { from { transform: translateX(0); } to { transform: translateX(-30%); opacity: 0.6; } }
  @keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(30%); opacity: 0.6; } }
  @keyframes scanline {
    0%   { top: 18%; opacity: 0.4; }
    50%  { top: 78%; opacity: 1; }
    100% { top: 18%; opacity: 0.4; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.7; transform: scale(0.98); }
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    100% { transform: scale(1); }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40%           { transform: scale(1); opacity: 1; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pinFill {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes pinShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes dialogPop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes modalUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes pinDigitIn {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes successPop {
    0%   { opacity: 0; transform: scale(0.3); }
    70%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes successRing {
    0%   { opacity: 0.8; transform: scale(0.8); }
    100% { opacity: 0;   transform: scale(1.6); }
  }
  @keyframes successCheck {
    to { stroke-dashoffset: 0; }
  }
  @keyframes iosFaceIdIn {
    0%   { transform: translateX(-50%) scale(0.3); opacity: 0; }
    60%  { transform: translateX(-50%) scale(1.04); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }

  @keyframes errorPop {
    0%   { opacity: 0; transform: scale(0.3); }
    70%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ── Splash: logo fade-in then fade-out to login ──────── */
  @keyframes splashLogoIn {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes splashFadeOut {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes stepperPipPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes stepperPipDone {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes stepperCheckIn {
    0%   { opacity: 0; transform: scale(0.4) rotate(-12deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
</style>
</head>
