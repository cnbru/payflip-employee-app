<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proto — Task guidance pattern</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--gray-100);
      color: var(--gray-900);
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Shell ──────────────────────────────────────────────────────────── */
    .shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--gray-0);
      border-right: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 16px 20px 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      color: var(--gray-900);
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-nav { padding: 8px 0; flex: 1; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 20px;
      font-size: 13px;
      font-family: var(--font-body);
      color: var(--gray-700);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      border-radius: 0;
    }
    .nav-item.active {
      color: var(--gray-900);
      font-weight: 600;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--bg-primary-default);
    }
    .nav-item { position: relative; }
    .relaunch-card {
      margin: 8px 12px 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--purple-050, #f3f0ff);
      cursor: pointer;
    }
    .relaunch-card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12px;
      color: var(--bg-primary-default);
      margin-bottom: 2px;
    }
    .relaunch-card-sub {
      font-size: 11px;
      color: var(--gray-600, var(--gray-700));
      line-height: 1.4;
    }

    /* Main content */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Page header */
    .page-header {
      padding: 20px 28px 16px;
      background: var(--gray-100);
      flex-shrink: 0;
    }
    .page-header h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      color: var(--gray-900);
      letter-spacing: -0.02em;
    }
    .page-header-sub {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 1px;
    }
    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Table toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 28px 12px;
      background: var(--gray-100);
      flex-shrink: 0;
    }
    .search-input {
      padding: 7px 12px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 13px;
      background: var(--gray-0);
      color: var(--gray-900);
      width: 180px;
    }
    .filter-btn {
      padding: 7px 12px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 12px;
      font-family: var(--font-body);
      background: var(--gray-0);
      color: var(--gray-700);
      cursor: pointer;
    }

    /* Scrollable content area */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }

    /* Employee table */
    .emp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .emp-table th {
      padding: 8px 16px;
      text-align: left;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 11px;
      color: var(--gray-500);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--gray-200);
      background: var(--gray-100);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .emp-table td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--gray-150, var(--gray-200));
      font-variant-numeric: tabular-nums;
      color: var(--gray-900);
      background: var(--gray-0);
    }
    .emp-table td.muted { color: var(--gray-500); }
    .emp-table td.amount { text-align: right; }
    .emp-table tr:last-child td { border-bottom: none; }

    /* Review badge on row */
    .review-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--warning-100);
      color: var(--warning-700);
      white-space: nowrap;
    }

    /* Generic btn */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 120ms ease, background 120ms ease;
    }
    .btn-primary {
      background: var(--bg-primary-default);
      color: #fff;
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--gray-0);
      color: var(--gray-900);
      border: 1px solid var(--gray-200);
    }
    .btn-ghost {
      background: transparent;
      color: var(--bg-primary-default);
      padding: 0;
    }

    /* ── Variant 1: Sticky strip ──────────────────────────────────────── */
    .sticky-strip {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--gray-0);
      border-bottom: 1px solid var(--gray-200);
      box-shadow: 0 1px 0 var(--gray-100), 0 2px 8px rgba(15,13,40,0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 28px;
      height: 48px;
      min-height: 48px;
      flex-shrink: 0;
    }
    .strip-rocket {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--purple-050, #f3f0ff);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }
    .strip-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      color: var(--gray-900);
      white-space: nowrap;
    }
    .strip-entity {
      font-size: 12px;
      color: var(--gray-500);
      white-space: nowrap;
    }
    .strip-divider { width: 1px; height: 16px; background: var(--gray-200); flex-shrink: 0; }
    .strip-checklist {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      overflow: hidden;
    }
    .strip-check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--gray-600, var(--gray-700));
      white-space: nowrap;
    }
    .strip-check-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f3f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--bg-primary-default);
      flex-shrink: 0;
    }
    .strip-spacer { flex: 1; }
    .strip-deadline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--warning-100);
      color: var(--warning-700);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .strip-confirm {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-left: 12px;
      border-left: 1px solid var(--gray-200);
    }
    .strip-confirm label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--gray-700);
      cursor: pointer;
      white-space: nowrap;
    }

    /* ── Variant 2: Annotated table ──────────────────────────────────── */
    .annotated-hint {
      margin: 0 28px 12px;
      padding: 8px 12px;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--gray-700);
    }
    .annotated-hint strong { color: var(--gray-900); font-weight: 600; }

    .col-highlight th.highlighted {
      background: var(--purple-050, #f3f0ff);
      color: var(--bg-primary-default);
      border-bottom: 2px solid var(--bg-primary-default);
    }

    .completion-float {
      position: fixed;
      bottom: 80px;
      right: 28px;
      background: var(--gray-0);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow:
        0 2px 4px rgba(15,13,40,0.04),
        0 8px 24px rgba(15,13,40,0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 220px;
      z-index: 100;
    }
    .completion-float-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 12px;
      color: var(--gray-900);
    }
    .completion-float label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--gray-700);
      line-height: 1.45;
      cursor: pointer;
    }
    .completion-float label input { margin-top: 2px; accentColor: var(--bg-primary-default); flex-shrink: 0; }

    /* ── Variant 3: Side panel ────────────────────────────────────────── */
    .side-panel-layout {
      display: flex;
      height: 100%;
      overflow: hidden;
    }
    .side-panel-table {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
    }
    .side-panel {
      width: 260px;
      flex-shrink: 0;
      border-left: 1px solid var(--gray-200);
      background: var(--gray-0);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--gray-200);
      flex-shrink: 0;
    }
    .panel-task-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 4px;
    }
    .panel-task-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      color: var(--gray-900);
      line-height: 1.35;
    }
    .panel-deadline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--warning-100);
      color: var(--warning-700);
    }
    .panel-body {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .panel-section-label {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 11px;
      color: var(--gray-900);
      margin-bottom: 8px;
    }
    .panel-steps { display: flex; flex-direction: column; gap: 8px; }
    .panel-step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .panel-step-num {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #f3f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--bg-primary-default);
      margin-top: 1px;
    }
    .panel-step-text {
      font-size: 12px;
      color: var(--gray-900);
      line-height: 1.45;
    }
    .panel-step-note {
      font-size: 11px;
      color: var(--gray-600, var(--gray-700));
      line-height: 1.4;
      margin-top: 2px;
    }
    .panel-video {
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #1a1625;
      position: relative;
      cursor: pointer;
    }
    .panel-video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #2d1f4e 0%, #1a1020 50%, #0f1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel-play::after {
      content: '';
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 10px solid rgba(255,255,255,0.9);
      margin-left: 2px;
    }
    .panel-video-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
    }
    .panel-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--gray-200);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-footer label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--gray-700);
      line-height: 1.45;
      cursor: pointer;
    }
    .panel-footer label input { margin-top: 2px; accent-color: var(--bg-primary-default); flex-shrink: 0; }
    .panel-footer-hint {
      font-size: 11px;
      color: var(--gray-500);
      text-align: center;
    }

    /* ── Picker (verbatim from PICKER.md) ─────────────────────────────── */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Sticky strip</button>
  <button class="proto-picker-item">Annotated table</button>
  <button class="proto-picker-item">Side panel</button>
</nav>

<script>

function sidebar() {

    <div class="sidebar">

function tableRows() {

// ─────────────────────────────────────────────────────────────────────────────
// Variant 1 — Sticky strip
// The guidance is a 48px bar that sticks below the content header. It stays
// visible at ALL times as the user scrolls through employees. Confirmation lives
// inline in the bar so completion is always one click away.
// ─────────────────────────────────────────────────────────────────────────────
function variantStickyStrip() {
  return `
    <div class="shell">
      ${sidebar()}
      <div class="main">
        <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between">
          <div>
            <div style="font-size:11px;color:var(--gray-500);margin-bottom:4px">Lumio Group</div>
            <h1>Employees</h1>
            <div class="page-header-sub">Overview</div>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-secondary" style="font-size:12px">Bulk actions</button>
            <button class="btn btn-primary" style="font-size:12px">+ Add a user</button>
          </div>
        </div>

        <div class="content-scroll">
          <!-- STICKY STRIP: sticks to top of scrollable area -->
          <div class="sticky-strip" id="v1-strip">

// ── Harness (verbatim from PICKER.md) ────────────────────────────────────────
const variants = [variantStickyStrip, variantAnnotatedTable, variantSidePanel];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
