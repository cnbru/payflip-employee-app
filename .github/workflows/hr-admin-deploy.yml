name: Deploy HR Admin to payflip-hr-admin

# Manual-only: deploys hr-admin to the standalone cnbru/payflip-hr-admin repo
# and requires the HR_ADMIN_DEPLOY_TOKEN secret. The canonical prototype URL is
# the payflip-employee-app Pages site (see pages.yml), so this no longer runs on
# every push — trigger it from the Actions tab when you want the standalone repo
# updated. Left on push it just fails (missing token) and adds red-X noise.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare hr-admin site
        run: |
          mkdir -p _hr_site
          cp -r project/hr-admin/. _hr_site/
          # Resolve fonts symlink — copy real font files
          rm -rf _hr_site/fonts
          cp -r project/employee-app/fonts/. _hr_site/fonts/
          # Copy benefit/choice images (referenced as assets/ in app.jsx)
          cp -r project/assets/. _hr_site/assets/
          # index.html references /hr-admin/... as domain-absolute paths, which
          # is correct for local dev (served under that subpath) but resolves
          # to the wrong origin-root path once deployed at the repo root under
          # GitHub Pages' /payflip-hr-admin/ prefix. Rewrite to root-relative
          # paths so they resolve correctly wherever this site is served from.
          sed -i 's#/hr-admin/#./#g' _hr_site/index.html
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.HR_ADMIN_DEPLOY_TOKEN }}
          repository-name: cnbru/payflip-hr-admin
          branch: main
          folder: _hr_site
          clean: true
