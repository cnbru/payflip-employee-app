name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site

          # Employee app at the site root. Plain -R (NOT -L): the employee app
          # carries an "hr-admin" convenience symlink whose target is a dev-only
          # absolute path that doesn't exist in CI, so dereferencing it would
          # fail. -R copies the symlink as-is; we drop it and lay down the real
          # tree next.
          cp -R project/employee-app/. _site/
          rm -rf _site/hr-admin

          # hr-admin as a real directory. -L dereferences its "assets" and
          # "fonts" symlinks (both relative, resolvable in CI) so real files
          # land on gh-pages — copying the symlinks themselves would dangle,
          # which was a past breakage.
          cp -RL project/hr-admin/. _site/hr-admin/

          # index.html uses relative asset paths + a <base> shim that resolves
          # them at runtime, so no path rewriting is needed here anymore.

          # SPA deep-link fallback: GitHub Pages serves the site-root 404.html
          # for any path it can't find as a static file. The hr-admin app is a
          # client-side router, so a reload/share of e.g. /hr-admin/people has
          # no matching file. Serving the hr-admin bootstrap as 404.html lets
          # the app boot and render the right screen from window.location.
          cp _site/hr-admin/index.html _site/404.html

          # Skip Jekyll processing so nothing is silently dropped or rewritten.
          touch _site/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          clean: true
          clean-exclude: preview/
