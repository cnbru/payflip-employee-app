name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site

          # Employee app at the site root. -L dereferences symlinks (the
          # employee app contains an "hr-admin" symlink pointing back at
          # project/hr-admin); we remove that copy below and lay down the
          # canonical hr-admin tree instead.
          cp -RL project/employee-app/. _site/
          rm -rf _site/hr-admin

          # hr-admin as a real directory. -L dereferences its "assets" and
          # "fonts" symlinks so real files land on gh-pages (copying the
          # symlinks themselves would dangle — this was a past breakage).
          cp -RL project/hr-admin/. _site/hr-admin/

          # index.html uses relative asset paths + a <base> shim that resolves
          # them at runtime, so no path rewriting is needed here anymore.

          # SPA deep-link fallback: GitHub Pages serves the site-root 404.html
          # for any path it can't find as a static file. The hr-admin app is a
          # client-side router, so a reload/share of e.g. /hr-admin/people has
          # no matching file. Serving the hr-admin bootstrap as 404.html lets
          # the app boot and render the right screen from window.location.
          cp _site/hr-admin/index.html _site/404.html

          # Skip Jekyll processing so nothing is silently dropped or rewritten.
          touch _site/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          clean: true
          clean-exclude: preview/
